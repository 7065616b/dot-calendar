name: Windows checks

on:
  push:
    branches: [main]
    paths: ['src/**', 'resources/**', 'scripts/**', 'installer/**', 'integration/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.github/workflows/check.yml']
  pull_request:
    paths: ['src/**', 'resources/**', 'scripts/**', 'installer/**', 'integration/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.github/workflows/check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Rust and resource compiler
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add clippy rustfmt
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK resource compiler not found.' }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          # rc.exe is launched directly rather than through a VS developer
          # shell, so supply the matching SDK headers for VERSIONINFO constants.
          $sdkVersion = $rc.Directory.Parent.Name
          $sdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$sdkVersion"
          if (-not (Test-Path "$sdkInclude\um\winver.h")) { throw 'Matching Windows SDK headers not found.' }
          "INCLUDE=$sdkInclude\um;$sdkInclude\shared;$sdkInclude\ucrt;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --release --locked
      - name: Isolated CLI and MCP smoke
        shell: pwsh
        run: ./scripts/smoke.ps1 -ExePath "$pwd\target\release\dot-calendar.exe"
      - name: Installed Dot connection and helper
        shell: pwsh
        run: ./scripts/test-dot-connection.ps1 -ExePath "$pwd\target\release\dot-calendar.exe"
      - name: Dot helper deletion and recovery regressions
        shell: pwsh
        run: ./integration/dot-calendar/scripts/test-invoke-calendar.ps1 -ExePath "$pwd\target\release\dot-calendar.exe"
      - name: Offline contest collection regressions
        shell: pwsh
        run: |
          ./scripts/test-contest-extraction.ps1
          ./scripts/test-contest-collector.ps1
          ./scripts/test-contest-sources.ps1
          ./scripts/test-contest-schedule.ps1
