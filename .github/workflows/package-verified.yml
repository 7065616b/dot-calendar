name: Package verified native release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.3.18
          persist-credentials: false
      - name: Package the already verified portable payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne '7065616b/dot-calendar') { throw 'Unexpected repository.' }
          if ((git rev-parse HEAD).Trim() -cne 'eb71dd8f6180e23de1e8582a6fff7616c16d0bc5') { throw 'Reviewed source tag changed.' }
          $api = 'https://api.github.com/repos/7065616b/dot-calendar'
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'User-Agent'='AI-Calendar-verified-packager'}
          $release = Invoke-RestMethod "$api/releases/413981108" -Headers $headers
          if (-not $release.draft -or $release.tag_name -cne 'v0.3.18') { throw 'Only the reviewed draft may receive assets.' }
          $asset = @($release.assets | Where-Object name -CEQ 'dot-calendar-0.3.18-windows-x64-preview.zip')
          $zipHash = '07d8f1a4e09c355d383c1a8d8f32e51947d3e2fa40298f15d77a6a64436b005a'
          if ($asset.Count -ne 1 -or $asset[0].digest -cne "sha256:$zipHash") { throw 'Portable asset digest differs.' }
          $output = Join-Path $env:RUNNER_TEMP 'verified-package'
          New-Item -ItemType Directory -Path $output | Out-Null
          $zip = Join-Path $output $asset[0].name
          $headers.Accept = 'application/octet-stream'
          Invoke-WebRequest "$api/releases/assets/$($asset[0].id)" -Headers $headers -OutFile $zip
          $headers.Accept = 'application/vnd.github+json'
          if ((Get-FileHash $zip).Hash.ToLowerInvariant() -cne $zipHash) { throw 'Downloaded archive differs.' }
          $payload = Join-Path $output 'payload'
          Expand-Archive -LiteralPath $zip -DestinationPath $payload
          $exe = Join-Path $payload 'dot-calendar.exe'
          if ((Get-FileHash $exe).Hash -cne 'DB3403254D079D1BCE50086AD163911F1F5162ED322424DB36268B3247D6F099') { throw 'Native binary differs.' }
          if ((Get-Item $exe).VersionInfo.ProductName -cne 'AI 캘린더') { throw 'Native display name differs.' }
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compilerPath = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $compilerPath)) { throw 'Preinstalled Inno compiler unavailable.' }
          & $compilerPath '-dAppVersion=0.3.18' "-dSourceDir=$payload" "-o$output" 'installer/dot-calendar.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $setupName = 'dot-calendar-0.3.18-windows-x64-setup.exe'
          $setup = Join-Path $output $setupName
          $setupHash = (Get-FileHash $setup).Hash.ToLowerInvariant()
          [IO.File]::WriteAllLines((Join-Path $output 'SHA256SUMS.txt'), @("$zipHash  $($asset[0].name)", "$setupHash  $setupName"), [Text.UTF8Encoding]::new($false))
          foreach ($name in @($setupName, 'SHA256SUMS.txt')) {
            $file = Join-Path $output $name
            $hash = (Get-FileHash $file).Hash.ToLowerInvariant()
            $existing = @($release.assets | Where-Object name -CEQ $name)
            if ($existing.Count -gt 1) { throw 'Duplicate asset names.' }
            if ($existing.Count -eq 0) {
              $upload = 'https://uploads.github.com/repos/7065616b/dot-calendar/releases/413981108/assets?name=' + [uri]::EscapeDataString($name)
              $existing = @(Invoke-RestMethod -Method Post -Uri $upload -Headers $headers -ContentType 'application/octet-stream' -InFile $file)
            }
            if ($existing[0].digest -cne "sha256:$hash" -or $existing[0].size -ne (Get-Item $file).Length) { throw 'Asset mismatch; never overwrite an existing asset.' }
            Write-Output "$name SHA256 $hash"
          }
          Write-Output 'Verified installer and checksums are staged in the draft. No release was published.'